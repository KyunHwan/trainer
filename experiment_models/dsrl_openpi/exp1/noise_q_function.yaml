schema_version: 1

# input_dim = sum of all flattened processor outputs:
#   head:   output_img_channel * H' * W'    = 24 * 8 * 10 = 1920  (ResNet34, 240x320 input)
#   left:                                   = 24 * 8 * 10 = 1920
#   right:                                  = 24 * 8 * 10 = 1920
#   proprio: obs_history * obs_dim          = 50 * 24      = 1200
#   action:  action_chunk_size * action_dim = 50 * 32      = 1600  (noise)
#   total:                                              = 8560

params:
  input_dim: 8560
  num_ensemble: 10
  num_layers: 4
  num_hidden_dim: 2048
  dropout: 0.0

model:
  graph:
    inputs: [flat_features]
    modules:
      q_fn:
        _type_: dsrl_q_function
        input_dim: ${params.input_dim}
        num_ensemble: ${params.num_ensemble}
        num_layers: ${params.num_layers}
        num_hidden_dim: ${params.num_hidden_dim}
        dropout: ${params.dropout}
    nodes:
      - name: q_value
        call: module:q_fn
        kwargs:
          flattened_tensor: $flat_features
    outputs: [$q_value]
    return: single
