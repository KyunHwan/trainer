plugins:
  - "experiment_training.components.dataloader.lerobot_data"
  - "experiment_training.components.loss.sinkhorn_knopp"
  - "experiment_training.components.optimizer.adamw_cosine_decay"
  - "experiment_training.components.trainer.reinforcement_learning.dsrl_openpi.dsrl_openpi_trainer"

model:
  find_unused_parameters: true
  component_config_paths:
    openpi_model:         "experiment_models/dsrl_openpi/exp1/openpi_model.yaml"
    q_function_img_encoder: "experiment_models/dsrl_openpi/exp1/q_function_img_encoder.yaml"
    noise_q_function_img_encoder: "experiment_models/dsrl_openpi/exp1/noise_q_function_img_encoder.yaml"
    noise_actor_img_encoder: "experiment_models/dsrl_openpi/exp1/noise_actor_img_encoder.yaml"
    #da3:                  "experiment_models/dsrl_openpi/exp1/da3.yaml"
    q_function_processor: "experiment_models/dsrl_openpi/exp1/q_function_processor.yaml"
    q_function:           "experiment_models/dsrl_openpi/exp1/q_function.yaml"
    noise_q_function:     "experiment_models/dsrl_openpi/exp1/noise_q_function.yaml"
    noise_q_function_processor: "experiment_models/dsrl_openpi/exp1/noise_q_function_processor.yaml"
    noise_processor:      "experiment_models/dsrl_openpi/exp1/noise_processor.yaml"
    noise_actor:          "experiment_models/dsrl_openpi/exp1/noise_actor.yaml"

  component_build_args:
    openpi_model:         { init: false, freeze: true }   # frozen pretrained diffusion policy
    q_function_img_encoder:       { init: false, freeze: false }   # pretrained ResNet34 tri-camera encoder
    noise_q_function_img_encoder: { init: false, freeze: false }   # pretrained ResNet34 tri-camera encoder
    noise_actor_img_encoder:      { init: false, freeze: false }   # pretrained ResNet34 tri-camera encoder
    #da3:                  { init: false, freeze: true }   # frozen depth estimator
    q_function_processor: { init: true,  freeze: false }
    q_function:           { init: true,  freeze: false }
    noise_q_function:     { init: true,  freeze: false }
    noise_q_function_processor:  { init: true,  freeze: false }
    noise_processor:      { init: true,  freeze: false }
    noise_actor:          { init: true,  freeze: false }

  component_optims:
    q_function_img_encoder:
      type: "adamw_warmup_cosine_decay"
      params:
        peak_lr: 3.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-10
        weight_decay: 1.0e-5
        total_steps: 200000
        warmup_steps: 2000
        start_lr: 1.0e-6
        end_lr: 1.0e-6
    noise_q_function_img_encoder:
      type: "adamw_warmup_cosine_decay"
      params:
        peak_lr: 3.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-10
        weight_decay: 1.0e-5
        total_steps: 200000
        warmup_steps: 2000
        start_lr: 1.0e-6
        end_lr: 1.0e-6
    noise_actor_img_encoder:
      type: "adamw_warmup_cosine_decay"
      params:
        peak_lr: 3.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-10
        weight_decay: 1.0e-5
        total_steps: 200000
        warmup_steps: 2000
        start_lr: 1.0e-6
        end_lr: 1.0e-6
    q_function_processor:
      type: "adamw_warmup_cosine_decay"
      params:
        peak_lr: 3.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-10
        weight_decay: 1.0e-5
        total_steps: 200000
        warmup_steps: 2000
        start_lr: 1.0e-6
        end_lr: 1.0e-6
    q_function:
      type: "adamw_warmup_cosine_decay"
      params:
        peak_lr: 3.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-10
        weight_decay: 1.0e-5
        total_steps: 200000
        warmup_steps: 2000
        start_lr: 1.0e-6
        end_lr: 1.0e-6
    noise_q_function_processor:
      type: "adamw_warmup_cosine_decay"
      params:
        peak_lr: 3.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-10
        weight_decay: 1.0e-5
        total_steps: 200000
        warmup_steps: 2000
        start_lr: 1.0e-6
        end_lr: 1.0e-6
    noise_q_function:
      type: "adamw_warmup_cosine_decay"
      params:
        peak_lr: 3.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-10
        weight_decay: 1.0e-5
        total_steps: 200000
        warmup_steps: 2000
        start_lr: 1.0e-6
        end_lr: 1.0e-6
    noise_processor:
      type: "adamw_warmup_cosine_decay"
      params:
        peak_lr: 3.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-10
        weight_decay: 1.0e-5
        total_steps: 200000
        warmup_steps: 2000
        start_lr: 1.0e-6
        end_lr: 1.0e-6
    noise_actor:
      type: "adamw_warmup_cosine_decay"
      params:
        peak_lr: 1.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-10
        weight_decay: 1.0e-5
        total_steps: 200000
        warmup_steps: 2000
        start_lr: 1.0e-6
        end_lr: 1.0e-6

data:
  datamodule:
    type: "lerobot_dataset_factory"
    params:
      task_name: 'dsrl_picknplace'
      local_files_only: false
      root: '.'
      repo_id: 'joon001001/igris-b-pnp-v5'
      action_horizon: 50
      obs_proprio_history: 50
      obs_images_history: 1
      HZ: 20
  batch_size: 128
  num_workers: 12
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1

train:
  project_name: 'dsrl_openpi_exp1'
  epoch: 500
  load_dir: "/home/user/Projects/online_rl/trainer/experiment_training/reinforcement_learning/dsrl_openpi/exp1/epoch_15"
  save_every: 20
  save_dir: "/home/user/Projects/online_rl/trainer/experiment_training/reinforcement_learning/dsrl_openpi/online_rl"
  trainer:
    type: 'dsrl_openpi_trainer'
  loss:
    type: "sinkhorn_knopp"   # required by schema; not used by this trainer
    params:
      p: 1
      lam_state: 0.2
      blur: 0.004
      debias: true
      backend: "auto"
      scaling: 0.5
